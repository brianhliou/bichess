name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "docker-compose.yml"
      - "railway*.json"
      - "railpack.json"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "docker-compose.yml"
      - "railway*.json"
      - "railpack.json"

concurrency:
  group: ci-node-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke-plan:
    name: Browser smoke plan
    runs-on: ubuntu-latest
    outputs:
      run_browser_smoke: ${{ steps.browser-smoke-plan.outputs.run_browser_smoke }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plan browser smoke
        id: browser-smoke-plan
        run: node scripts/ci-browser-smoke-plan.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Translation catalog policy
        run: npm run i18n:check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build workspace dependencies
        run: |
          npm run build --workspace @mistboard/game
          npm run build --workspace @mistboard/board-render
      - name: Typecheck
        run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build workspace dependencies
        run: |
          npm run build --workspace @mistboard/game
          npm run build --workspace @mistboard/board-render
          npm run build --workspace @mistboard/server
      - name: Unit tests
        run: npm run test:unit

  puzzle-corpus:
    name: Puzzle corpus verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Full kernel verification of every shipped puzzle (~24s). Lives here as
      # its own parallel job so the local test:unit hot path only runs a
      # 5-puzzle sample plus a corpus content-hash pin.
      - name: Verify puzzle corpus
        run: npm run test:puzzles:corpus

  integration:
    name: Server integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bichess
          POSTGRES_PASSWORD: bichess
          POSTGRES_DB: bichess
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bichess:bichess@localhost:5432/bichess
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build workspace dependencies
        run: |
          npm run build --workspace @mistboard/game
          npm run build --workspace @mistboard/board-render
      - name: Server integration
        run: |
          npm run test:persistent --workspace @mistboard/server
          MISTBOARD_ALLOW_IN_MEMORY_PERSISTENCE=true TEST_DATABASE_URL=$TEST_DATABASE_URL npm run test:integration --workspace @mistboard/server

  browser-smoke:
    name: Browser smoke
    needs: [browser-smoke-plan]
    if: needs.browser-smoke-plan.outputs.run_browser_smoke == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build workspace dependencies
        run: |
          npm run build --workspace @mistboard/game
          npm run build --workspace @mistboard/board-render
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: npm run test --workspace @mistboard/web

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev

  node:
    name: node
    needs:
      - browser-smoke-plan
      - lint
      - build
      - typecheck
      - unit
      - puzzle-corpus
      - integration
      - browser-smoke
      - audit
    # NOT always(): a concurrency-cancelled run must conclude as cancelled, not
    # failure. With always() the aggregator ran anyway, saw cancelled needs, and
    # exited 1, so notify-ci-failure filed phantom "CI red on main" issues
    # (#226, #229). When this job skips, needs.node.result is 'skipped' and
    # neither notify-ci-failure nor close-ci-failure fires.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          node <<'EOF'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failures = Object.entries(needs).filter(([name, job]) => {
            if (name === 'browser-smoke' && job.result === 'skipped') return false;
            return job.result !== 'success';
          });
          if (failures.length > 0) {
            for (const [name, job] of failures) {
              console.error(`${name}: ${job.result}`);
            }
            process.exit(1);
          }
          console.log('all required CI jobs passed');
          EOF

  # --- Code-red signal (label: ci-failure) -----------------------------------
  # The `node` job is "did you break the build/tests". Its own self-clearing issue.

  notify-ci-failure:
    # Files (or appends to) the ci-failure issue when the build/test job fails on main.
    needs: [node]
    if: always() && needs.node.result == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);
            const commitMsg = (context.payload.head_commit?.message ?? '').split('\n')[0];
            const body = [
              `CI (build/test) failed on \`main\` at \`${sha}\` — ${commitMsg}`,
              '',
              `Run: ${runUrl}`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 1,
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'CI red on main',
                body,
                labels: ['ci-failure'],
              });
            }

  close-ci-failure:
    # Closes the open ci-failure issue when the build/test job goes green on main.
    needs: [node]
    if: always() && needs.node.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 20,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ CI (build/test) green on \`main\` at \`${sha}\` — auto-closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
