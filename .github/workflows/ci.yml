name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "docker-compose.yml"
      - "railway*.json"
      - "railpack.json"
      - "nixpacks.toml"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "docker-compose.yml"
      - "railway*.json"
      - "railpack.json"
      - "nixpacks.toml"

concurrency:
  group: ci-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bichess
          POSTGRES_PASSWORD: bichess
          POSTGRES_DB: bichess
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bichess:bichess@localhost:5432/bichess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Test with Postgres
        run: |
          npm run test --workspace @mistboard/game
          npm run test --workspace @mistboard/web
          npm run test:persistent --workspace @mistboard/server
      - name: Audit production dependencies
        run: npm audit --omit=dev
