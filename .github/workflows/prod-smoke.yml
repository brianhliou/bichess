name: Prod Smoke

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Run full room + engine smoke instead of lite health smoke"
        required: false
        default: false
        type: boolean
      expect_revision:
        description: "Optional deployed revision to wait for and assert"
        required: false
        type: string

concurrency:
  group: prod-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prod-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      EXPECTED_REVISION: ${{ inputs.expect_revision }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: node scripts/time-command.mjs --label "prod-smoke npm ci" -- npm ci
      - name: Wait for Railway deploy
        if: inputs.expect_revision != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/time-command.mjs --label "Railway revision wait" -- npm run prod:wait-revision -- --expect-revision "$EXPECTED_REVISION" --timeout-ms 900000
      - name: Web smoke
        if: inputs.expect_revision == ''
        run: node scripts/time-command.mjs --label "Web smoke" -- npm run prod:smoke
      - name: Web smoke with revision
        if: inputs.expect_revision != ''
        run: node scripts/time-command.mjs --label "Web smoke" -- npm run prod:smoke -- --expect-revision "$EXPECTED_REVISION"
      - name: Engine smoke
        run: node scripts/time-command.mjs --label "Engine smoke" -- npm run prod:smoke:engines

  prod-lite-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.full != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Prod lite smoke
        run: node scripts/time-command.mjs --label "Prod lite smoke" -- npm run prod:smoke:lite

  notify-prod-failure:
    needs: [prod-smoke, prod-lite-smoke]
    if: always() && (needs.prod-smoke.result == 'failure' || needs.prod-lite-smoke.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha?.slice(0, 7) ?? 'unknown';
            const commitMsg = (
              context.payload.head_commit?.message ??
              'manual prod-lite smoke'
            ).split('\n')[0];
            const full = context.payload.inputs?.full === true || context.payload.inputs?.full === 'true';
            const smokeName = context.eventName === 'workflow_dispatch' && full ? 'Manual prod smoke' : 'Manual prod-lite smoke';
            const body = [
              `${smokeName} failed on \`main\` at \`${sha}\` — ${commitMsg}`,
              '',
              `This is a deploy/health signal, not necessarily a code bug.`,
              '',
              `Run: ${runUrl}`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'prod-health',
              per_page: 1,
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${smokeName} failing`,
                body,
                labels: ['prod-health'],
              });
            }

  close-prod-health:
    needs: [prod-smoke, prod-lite-smoke]
    if: always() && (needs.prod-smoke.result == 'success' || needs.prod-lite-smoke.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'prod-health',
              per_page: 20,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Prod smoke green on \`main\` at \`${sha}\` — auto-closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
